services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: festivo-frontend
    expose:
      - "5174"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - festivo

  caddy:
    image: caddy:2
    container_name: festivo-caddy
    ports:
      - "5173:5173"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - festivo

networks:
  festivo:

volumes:
  caddy_data:
  caddy_config: